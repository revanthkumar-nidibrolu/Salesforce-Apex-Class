<template>
    <lightning-card title={childObjectLabel} icon-name="standard:record">
        <div class="header-actions">
            <lightning-button
                label="New"
                variant="brand"
                onclick={handleNewDeal}>
            </lightning-button>
        </div>
        <div class="slds-p-around_medium">
            <template lwc:if={hasDeals}>
                <div class="custom-table">
                    <div class="table-header">
                        <div class="cell expand-cell"></div>
                        <template for:each={childFields} for:item="field">
                            <div class="cell"
                                key={field.apiName}>{field.label}
                            </div>
                        </template>
                    </div>
                    <template for:each={dealRows} for:item="deal">
                        <div key={deal.Id}>
                            <div class={deal.rowClass}
                                data-id={deal.Id}
                                onclick={handleDealClick}>
                                <div class="cell expand-cell">
                                    <lightning-icon
                                        icon-name={deal.iconName}
                                        size="x-small">
                                    </lightning-icon>
                                </div>
                                <template for:each={deal.cells} for:item="cell">
                                    <div class="cell" key={cell.key}>{cell.displayValue}</div>
                                </template>
                            </div>
                            <template lwc:if={deal.isExpanded}>
                                <div class="items-container">
                                    <template lwc:if={deal.hasItems}>
                                        <div class="items-title">{grandchildObjectLabel} </div>
                                        <div class="items-table">
                                            <div class="item-header">
                                                <template for:each={grandchildFields} for:item="field">
                                                    <div class="item-cell"
                                                        key={field.apiName}>{field.label}
                                                    </div>
                                                </template>
                                            </div>
                                            <template for:each={deal.dealItems} for:item="item">
                                                <div class="item-row"
                                                    key={item.Id}>
                                                    <template for:each={item.cells} for:item="cell">
                                                        <div class="item-cell"
                                                            key={cell.key}>{cell.displayValue}
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <div class="no-items">
                                            No {grandchildObjectLabel} found.
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
    <template lwc:if={showNewDealForm}>

    <section
        class="slds-modal slds-fade-in-open"
        role="dialog"
        aria-modal="true">

        <div class="slds-modal__container">

            <!-- HEADER -->
            <header class="slds-modal__header">

                <button
                    class="slds-button slds-button_icon slds-modal__close"
                    title="Close"
                    onclick={handleCancel}>

                    <lightning-icon
                        icon-name="utility:close"
                        size="small">
                    </lightning-icon>

                    <span class="slds-assistive-text">
                        Close
                    </span>

                </button>

                <h2 class="slds-text-heading_medium">
                    New {childObjectLabel}
                </h2>

            </header>


            <!-- BODY -->
            <div class="slds-modal__content custom-modal-content">

                <template lwc:if={hasCreateFields}>

                    <div class="create-form-grid">

                        <template
                            for:each={createFields}
                            for:item="field">

                            <div
                                class="form-field"
                                key={field.apiName}>


                                <!-- PICKLIST -->
                                <template lwc:if={field.isPicklist}>

                                    <lightning-combobox
                                        class="create-input"
                                        label={field.label}
                                        name={field.apiName}
                                        data-field={field.apiName}
                                        value={field.value}
                                        options={field.options}
                                        required={field.required}
                                        onchange={handleFieldChange}>
                                    </lightning-combobox>

                                </template>


                                <!-- MULTI PICKLIST -->
                                <template lwc:elseif={field.isMultiPicklist}>

                                    <lightning-dual-listbox
                                        class="create-input"
                                        label={field.label}
                                        name={field.apiName}
                                        data-field={field.apiName}
                                        value={field.value}
                                        options={field.options}
                                        source-label="Available"
                                        selected-label="Selected"
                                        onchange={handleFieldChange}>
                                    </lightning-dual-listbox>

                                </template>


                                <!-- LOOKUP -->
                                <template lwc:elseif={field.isLookup}>

                                    <lightning-record-picker
                                        class="create-input"
                                        label={field.label}
                                        object-api-name={field.lookupObjectApiName}
                                        value={field.value}
                                        data-field={field.apiName}
                                        required={field.required}
                                        disabled={field.isParentLookup}
                                        onchange={handleFieldChange}>
                                    </lightning-record-picker>

                                </template>


                                <!-- TEXTAREA -->
                                <template lwc:elseif={field.isTextArea}>

                                    <lightning-textarea
                                        class="create-input"
                                        label={field.label}
                                        name={field.apiName}
                                        data-field={field.apiName}
                                        value={field.value}
                                        required={field.required}
                                        onchange={handleFieldChange}>
                                    </lightning-textarea>

                                </template>


                                <!-- REMAINING FIELDS -->
                                <template lwc:else>

                                    <lightning-input
                                        class="create-input"
                                        label={field.label}
                                        name={field.apiName}
                                        data-field={field.apiName}
                                        value={field.value}
                                        type={field.inputType}
                                        required={field.required}
                                        onchange={handleFieldChange}>
                                    </lightning-input>

                                </template>

                            </div>

                        </template>

                    </div>

                </template>


                <!-- NO CREATE FIELDS -->
                <template lwc:else>

                    <div class="slds-p-around_large slds-text-align_center">

                        <p>
                            No create fields configured.
                        </p>

                        <p class="slds-text-color_weak slds-m-top_x-small">
                            Configure the "Records Create Fields"
                            property in Lightning App Builder.
                        </p>

                    </div>

                </template>

            </div>


            <!-- FOOTER -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    onclick={handleCancel}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Save"
                    variant="brand"
                    onclick={handleSave}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
</template>
