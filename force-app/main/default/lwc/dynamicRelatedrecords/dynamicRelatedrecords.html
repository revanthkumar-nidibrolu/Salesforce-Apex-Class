<template>
    <lightning-card title="Related Records" icon-name="standard:record">
        <template lwc:if={hasRecords}>
            <div class="slds-p-around_medium">
                <lightning-datatable
                    key-field="Id"
                    data={datatable}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium slds-text-align_center">{label.NoRelatedRecords}</div>
        </template>
    </lightning-card>
</template>
