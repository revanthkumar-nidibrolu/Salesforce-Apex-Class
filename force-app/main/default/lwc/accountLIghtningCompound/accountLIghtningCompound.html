<template>
    <lightning-card title="Create Opportunity" icon-name="standard:opportunity">
        <template lwc:if={isAccountStep}>
            <div class="slds-m-around_medium">
                <template lwc:if={showPicker}>
                    <lightning-record-picker
                        object-api-name="Account"
                        label="Select Account"
                        value={selectedRecordId}
                        onchange={handleRecordChange}>
                    </lightning-record-picker>
                </template>
            </div>
            <div class="slds-grid slds-grid_align-center slds-m-vertical_medium">
                <lightning-button label="Clear" onclick={handleAccountClear}></lightning-button>
                <lightning-button
                    class="slds-m-left_small"
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </div>
        </template>
        <template lwc:if={isOpportunityStep}>
            <div class="slds-m-around_medium">
                <c-opportunity-form
                    selected-record-id={selectedRecordId}
                    onback={handleBack}
                    onsuccess={handleSuccess}
                    onerror={handleError}>
                </c-opportunity-form>
            </div>
        </template>
    </lightning-card>
</template>
