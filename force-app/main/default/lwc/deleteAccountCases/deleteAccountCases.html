<template>
    <lightning-card title="Delete Account and Related Case" icon-name="standard:record">
        <div class="slds-var-m-around_medium">
            <lightning-record-picker
                lwc:if={showPicker}
                label="Select Account"
                object-api-name="Account"
                value={selectedAccountId}
                onchange={handleAccountChange}>
            </lightning-record-picker>
            <div class="slds-var-m-top_medium">
                <lightning-record-picker
                    lwc:if={showPicker}
                    label="Select Related Case"
                    object-api-name="Case"
                    filter={caseFilter}
                    disabled={isCasePickerDisabled}
                    onchange={handleCaseChange}>
                </lightning-record-picker>
            </div>
            <div class="slds-var-m-top_small" lwc:if={hasSelectedCases}>
                <lightning-pill-container
                    items={selectedCases}
                    onitemremove={handlePillRemove}>
                </lightning-pill-container>
            </div>
            <div class="slds-var-m-top_medium slds-align_absolute-center">
                <lightning-button 
                    label="Cancel" 
                    variant="neutral" 
                    onclick={handleCancel} 
                    class="slds-var-m-right_small">
                </lightning-button>
                <lightning-button 
                    label="Delete" 
                    variant="destructive" 
                    onclick={handleDelete} 
                    disabled={isDeleteDisabled}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
