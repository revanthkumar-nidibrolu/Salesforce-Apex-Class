<template>
    <lightning-card title="Account" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <lightning-record-picker
                label="Select an Account"
                object-api-name="Account"
                placeholder="Search Accounts..."
                onchange={accountChange}>
            </lightning-record-picker>
        </div>
        <template lwc:if={recordId}>
            <template lwc:if={isViewMode}>
                <lightning-record-view-form
                    record-id={recordId}
                    object-api-name="Account">
                    <div class="slds-p-around_medium">
                        <template
                            for:each={accountFields}
                            for:item="field">
                            <div
                                key={field}
                                class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <div class="slds-col slds-grow">
                                    <lightning-output-field
                                        field-name={field}>
                                    </lightning-output-field>
                                </div>
                                <template lwc:if={isAdmin}>
                                    <div class="slds-col slds-no-flex slds-m-left_small">
                                        <lightning-button-icon
                                            icon-name="utility:edit"
                                            alternative-text="Edit"
                                            title="Edit"
                                            data-field={field}
                                            onclick={handleEdit}>
                                        </lightning-button-icon>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-record-view-form>
            </template>
            <template lwc:else>
                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name="Account"
                    onsuccess={handleSuccess}
                    onerror={handleError}>
                    <div class="slds-p-around_medium">
                        <template for:each={accountFields}
                                  for:item="field">
                            <lightning-input-field
                                key={field}
                                field-name={field}>
                            </lightning-input-field>
                        </template>
                        <div class="slds-grid slds-grid_align-center slds-m-top_medium slds-p-bottom_medium">
                            <lightning-button
                                variant="brand"
                                type="submit"
                                label="Save"
                                class="slds-m-left_small">
                            </lightning-button>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={handleCancel}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-record-edit-form>
            </template>
        </template>
    </lightning-card>
</template>
